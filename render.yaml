# Render deploy: create a "Web Service" from this repo and Render
# reads this file automatically. Only secret to fill in by hand:
# DATABASE_URL (paste the Neon connection string).
services:
  - type: web
    name: dispatch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python migrate.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
