<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Driver App — Dispatch Console</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f4f6; }
    header { background: #1d4ed8; color: #fff; padding: 12px 16px;
             display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
    .online { background: #16a34a; }
    .offline { background: #b91c1c; }
    main { padding: 16px; max-width: 640px; margin: 0 auto; }
    .signin { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .signin input { padding: 8px; font-size: 16px; width: 90px; }
    .signin button { padding: 8px 16px; font-size: 16px; }
    .job { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 12px;
           box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .job h3 { margin: 0 0 6px; font-size: 15px; }
    .job p { margin: 3px 0; font-size: 14px; color: #374151; }
    .job .meta { color: #6b7280; font-size: 12px; }
    .deliver { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .deliver input[type=text] { padding: 8px; font-size: 14px; }
    .deliver button { background: #16a34a; border: 0; color: #fff;
                      padding: 10px; font-size: 15px; border-radius: 6px; }
    .incident { margin-top: 10px; border-top: 1px dashed #d1d5db;
                padding-top: 8px; display: flex; flex-direction: column;
                gap: 8px; }
    .incident select, .incident input[type=text] { padding: 8px; font-size: 14px; }
    .incident button { background: #b45309; border: 0; color: #fff;
                       padding: 10px; font-size: 15px; border-radius: 6px; }
    .reported { color: #b45309; font-weight: 600; }
    .done { color: #16a34a; font-weight: 600; }
    #queue { font-size: 13px; color: #b45309; padding: 0 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Driver App</h1>
    <span id="net" class="badge online">online</span>
  </header>
  <div id="queue"></div>
  <main>
    <div class="signin" id="loginBox">
      <label>Driver ID: <input id="driverId" type="number" value="1" /></label>
      <label>PIN: <input id="pin" type="password" value="" size="6" /></label>
      <button id="login">Sign in</button>
      <p class="meta" id="loginMsg"></p>
    </div>
    <div id="jobs"><p class="meta">Sign in to see your jobs.</p></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
