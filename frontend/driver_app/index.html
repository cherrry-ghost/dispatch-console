<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Driver App — Dispatch Console</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a1120" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0a1120; --panel: #101a2e; --panel-2: #0c1425; --bg-deep: #070d18;
      --border: #1d2b47; --border-strong: #2a3d63;
      --text: #d9e2f2; --muted: #8ba0bf; --faint: #5f7495;
      --accent: #38bdf8; --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif; margin: 0; color: var(--text);
      background: var(--bg); font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: rgba(7, 13, 24, 0.95); color: var(--text);
      padding: 12px 16px; display: flex; justify-content: space-between;
      align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
    }
    header h1 {
      font-size: 15px; margin: 0; letter-spacing: 2px;
      text-transform: uppercase; font-weight: 800;
    }
    .head-right { display: flex; align-items: center; gap: 10px; }
    .who { font-size: 13px; color: var(--muted); }
    .who b { color: var(--ok); }
    #logout {
      display: none; background: var(--panel-2); color: var(--muted);
      border: 1px solid var(--border-strong); border-radius: 8px;
      padding: 5px 10px; font-size: 12.5px; cursor: pointer;
    }
    .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
    .online { background: rgba(52, 211, 153, 0.15); color: var(--ok); }
    .offline { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    main { padding: 16px; max-width: 640px; margin: 0 auto; }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 16px;
    }
    .signin label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 14px; }
    input, select {
      background: var(--bg-deep); border: 1px solid var(--border-strong);
      color: var(--text); padding: 9px 10px; border-radius: 8px;
      font-size: 16px; font-family: inherit; width: 100%; margin-top: 4px;
    }
    input#driverId { max-width: 130px; }
    input#pin { max-width: 130px; letter-spacing: 4px; }
    button {
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent); font-weight: 700; padding: 10px 18px;
      font-size: 15px; border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: 0.5; }
    button.ghost {
      background: var(--panel-2); border: 1px solid var(--border-strong);
      color: var(--muted); font-weight: 500; font-size: 13px; padding: 7px 12px;
    }
    .job h3 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
    .job p { margin: 3px 0; font-size: 14px; color: var(--muted); }
    .job p b { color: var(--text); }
    .job .meta { color: var(--faint); font-size: 12px; }
    .deliver { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .deliver input[type=text] { font-size: 14px; }
    .deliver input[type=file] { font-size: 12.5px; color: var(--muted); }
    .deliver button {
      background: rgba(52, 211, 153, 0.14); border-color: rgba(52, 211, 153, 0.45);
      color: var(--ok); padding: 10px; font-size: 15px;
    }
    .incident {
      margin-top: 10px; border-top: 1px dashed var(--border-strong);
      padding-top: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .incident summary { color: var(--accent); cursor: pointer; font-size: 13.5px; }
    .incident select, .incident input[type=text] { font-size: 14px; }
    .incident button {
      background: rgba(251, 191, 36, 0.13); border-color: rgba(251, 191, 36, 0.45);
      color: var(--warn); padding: 10px; font-size: 15px;
    }
    .reported { color: var(--warn); font-weight: 600; }
    .done { color: var(--ok); font-weight: 600; }
    #queue { font-size: 13px; color: var(--warn); padding: 8px 16px 0; }
    .meta { color: var(--faint); font-size: 13px; }
    .profile { padding: 12px 14px; font-size: 13.5px; display: none; }
    .profile h3 {
      margin: 0 0 6px; font-size: 15px; color: var(--text);
      display: flex; justify-content: space-between; align-items: center;
    }
    .profile h3 .badge-muted { font-size: 11px; }
    .profile .row {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 4px 0; border-bottom: 1px dashed var(--border);
      color: var(--muted);
    }
    .profile .row:last-child { border-bottom: none; }
    .profile .row b { color: var(--text); font-weight: 600; }
    .lic { padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
    .lic-ok { background: rgba(52, 211, 153, 0.15); color: var(--ok); }
    .lic-soon { background: rgba(251, 191, 36, 0.14); color: var(--warn); }
    .lic-expired { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    h2.sect {
      font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--accent); margin: 18px 0 8px;
    }
    .done-row {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; margin-bottom: 8px;
      font-size: 13.5px; color: var(--muted);
    }
    .done-row .when { color: var(--faint); font-size: 12px; display: block; }
    .offer {
      background: linear-gradient(180deg, #12203a, #0e1830);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px; padding: 14px; margin-bottom: 14px;
    }
    .offer h3 { margin: 0 0 4px; font-size: 15px; color: var(--accent); }
    .offer .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .offer .opt {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; margin-bottom: 8px;
      font-size: 13.5px; color: var(--muted); cursor: pointer; width: 100%;
      text-align: left;
    }
    .offer .opt:hover { border-color: var(--accent); }
    .offer .lbl { font-weight: 700; }
    .lbl-safe { color: var(--ok); }
    .lbl-caution { color: var(--warn); }
    .lbl-needs_approval { color: var(--danger); }
    .offer .note { color: var(--ok); font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>Driver App</h1>
    <div class="head-right">
      <span id="who" class="who"></span>
      <button id="logout">Sign out</button>
      <span id="net" class="badge online">online</span>
    </div>
  </header>
  <div id="queue"></div>
  <main>
    <div id="profile" class="card profile"></div>
    <div id="offers"></div>
    <div class="card signin" id="loginBox">
      <label>Driver ID: <input id="driverId" type="number" value="1" /></label>
      <label>PIN: <input id="pin" type="password" value="" size="6"
                         inputmode="numeric" autocomplete="off" /></label>
      <button id="login">Sign in</button>
      <p class="meta" id="loginMsg"></p>
    </div>
    <div id="jobs"><p class="meta">Sign in to see your jobs.</p></div>
    <button id="load" class="ghost">Refresh jobs</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
