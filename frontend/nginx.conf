# Console UI: static build + API proxy so the browser talks to one origin.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /driver-app/ {
        proxy_pass http://api:8010/driver-app/;
    }

    location ~ ^/(login|driver|vehicles|shipments|assignments|locations|drivers|road-edges|zones|incidents|approvals|audit|events|notifications|copilot|planner|predict|model|datagen|simulate|playbooks|route|health|metrics|ws) {
        proxy_pass http://api:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
